name: Cloudflare Pages Production Publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to publish the current main'
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify build source
        run: |
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Build static site
        run: python scripts/build_cloudflare_site.py

      - name: Publish to Cloudflare Pages Production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
