name: Save request intake

on:
  workflow_run:
    workflows:
      - current-state-guard
    types: [completed]

concurrency:
  group: save-intake-global
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  intake:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve triggering pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq --arg sha "$SOURCE_SHA" '.[] | select(.head.sha == $sha) | .number')
          test "${#prs[@]}" = "1"
          pr_number="${prs[0]}"
          head_ref="$(gh pr view "$pr_number" --json headRefName --jq '.headRefName')"
          draft="$(gh pr view "$pr_number" --json isDraft --jq '.isDraft')"
          head_repo="$(gh pr view "$pr_number" --json headRepository --jq '.headRepository.nameWithOwner')"
          test "$draft" = "false"
          test "$head_repo" = "$GITHUB_REPOSITORY"
          case "$head_ref" in
            chat-save-request/*) ;;
            *) echo "Not a save-request PR; nothing to do."; exit 0 ;;
          esac
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted base branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Wait for earlier canonical save PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            mapfile -t saves < <(gh pr list --state open --base main --json number,headRefName --jq '.[] | select(.headRefName | startswith("save/direct-chat-")) | .number')
            if [ "${#saves[@]}" -eq 0 ]; then
              exit 0
            fi
            echo "Waiting for open canonical save PRs: ${saves[*]}"
            sleep 10
          done
          echo "Timed out waiting for earlier canonical save PRs." >&2
          exit 1

      - name: Validate and read queue entry
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' | sort)
          test "${#changed[@]}" = "1"
          queue_file="${changed[0]}"
          case "$queue_file" in
            .github/save-queue/*.md) ;;
            *) echo "Unexpected queue path: $queue_file" >&2; exit 1 ;;
          esac
          head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          gh api "repos/${GITHUB_REPOSITORY}/contents/${queue_file}?ref=${head_sha}" --jq '.content' |
            tr -d '\n' | base64 --decode > "$RUNNER_TEMP/direct-chat.md"
          test -s "$RUNNER_TEMP/direct-chat.md"
          echo "queue_file=$queue_file" >> "$GITHUB_OUTPUT"

      - name: Create isolated save branch from main
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base_sha="$(git rev-parse FETCH_HEAD)"
          branch="save/direct-chat-${GITHUB_RUN_ID}"
          git switch -c "$branch" "$base_sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Run canonical save script
        shell: bash
        run: |
          set -euo pipefail
          python scripts/save_and_currentize.py             --content-file "$RUNNER_TEMP/direct-chat.md"             --message '直チャット保存＋現在状態と生成ビューを一括同期'

      - name: Verify atomic save result
        env:
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t changed < <(git -c core.quotepath=false show --format='' --name-only HEAD | sed '/^$/d')
          test "${#changed[@]}" = "4"
          direct_chat_path="$(printf '%s\n' "${changed[@]}" | grep '^直チャット/')"
          test -n "$direct_chat_path"
          expected="$(printf '%s\n'             'BUD.md'             'docs/現在状態.json'             'docs/引き継ぎ/現在の引き継ぎ.md'             "$direct_chat_path")"
          actual="$(printf '%s\n' "${changed[@]}" | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

      - name: Push save branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git push --set-upstream origin "$BRANCH"

      - name: Open canonical save pull request
        env:
          GH_TOKEN: ${{ secrets.SAVE_PR_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "SAVE_PR_TOKEN repository secret is required." >&2; exit 1; }
          gh pr create             --base main             --head "$BRANCH"             --title '直チャット保存＋現在状態と生成ビューを一括同期'             --body $'Canonical direct-chat save executed by scripts/save_and_currentize.py on an Actions runner.'

      - name: Cleanup request branch
        if: success()
        env:
          SOURCE_BRANCH: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$SOURCE_BRANCH" || true
