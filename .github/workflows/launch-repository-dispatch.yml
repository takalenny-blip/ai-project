name: Launch repository dispatch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch save-direct-chat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTENT: "repository_dispatch 本番テスト"
          MESSAGE: "repository_dispatch 本番テスト"
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type='save-direct-chat' \
            -f client_payload[content]="$CONTENT" \
            -f client_payload[message]="$MESSAGE"
