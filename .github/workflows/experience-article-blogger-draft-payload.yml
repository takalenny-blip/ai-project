name: Experience article Blogger draft payload

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_blogger_draft_payload.py'
      - 'tests/test_build_blogger_draft_payload.py'
      - 'docs/経験ログ→Blogger下書きpayload_第4実装.md'
  push:
    branches: [main]
    paths:
      - 'scripts/build_blogger_draft_payload.py'
      - 'tests/test_build_blogger_draft_payload.py'
      - 'docs/経験ログ→Blogger下書きpayload_第4実装.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test Blogger draft payload builder
        run: python -m unittest tests/test_build_blogger_draft_payload.py
