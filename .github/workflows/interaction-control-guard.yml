name: Interaction control guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/interaction_guard.py'
      - 'scripts/interaction_preflight.py'
      - 'scripts/interaction_session.py'
      - 'tests/test_interaction_preflight.py'
      - 'tests/test_interaction_guard.py'
      - 'tests/test_interaction_session.py'
      - 'scripts/resume_check.py'
      - 'docs/現在状態.json'
      - '.github/workflows/interaction-control-guard.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/interaction_guard.py'
      - 'scripts/interaction_session.py'
      - 'scripts/resume_check.py'
      - 'tests/test_interaction_guard.py'
      - 'tests/test_interaction_session.py'
      - 'docs/現在状態.json'
      - '.github/workflows/interaction-control-guard.yml'

permissions:
  contents: read

jobs:
  interaction-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run interaction guard tests
        run: python -m unittest discover -s tests -p 'test_interaction_guard.py' -v
      - name: Run explicit interaction session tests
        run: python -m unittest discover -s tests -p 'test_interaction_session.py' -v
      - name: Run resume preflight against Dropbox when credentials are configured
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          if [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then
            DROPBOX_REQUIRE_REMOTE=1 python scripts/resume_check.py
          else
            echo "NOTICE: DROPBOX_ACCESS_TOKEN is not configured; running local-fixture preflight only."
            python -c "import zipfile; z=zipfile.ZipFile('/tmp/ci-dropbox-board.xlsx','w'); z.writestr('[Content_Types].xml','<Types></Types>'); z.writestr('xl/workbook.xml','<workbook></workbook>'); z.close()"
            DROPBOX_WORK_QUEUE_PATH=/tmp/ci-dropbox-board.xlsx python scripts/resume_check.py
          fi
