name: experience-blog-proposal
on:
  pull_request:
    paths: [scripts/build_blog_proposal.py, tests/test_build_blog_proposal.py, tests/fixtures/experience_article_candidate_EXP-0000000050.json, .github/workflows/experience-blog-proposal.yml]
  push:
    branches: [main]
    paths: [scripts/build_blog_proposal.py, tests/test_build_blog_proposal.py, tests/fixtures/experience_article_candidate_EXP-0000000050.json, .github/workflows/experience-blog-proposal.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - run: python -m unittest tests/test_build_blog_proposal.py
