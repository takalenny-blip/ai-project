name: Auto-approve repository PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (startsWith(github.event.pull_request.head.ref, 'bud/') ||
       startsWith(github.event.pull_request.head.ref, 'ops/') ||
       startsWith(github.event.pull_request.head.ref, 'fix/') ||
       startsWith(github.event.pull_request.head.ref, 'feat/') ||
       startsWith(github.event.pull_request.head.ref, 'docs/') ||
       startsWith(github.event.pull_request.head.ref, 'save/direct-chat-') ||
       startsWith(github.event.pull_request.head.ref, 'chat-save-request/'))
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical save PR shape (save PRs only)
        if: startsWith(github.event.pull_request.head.ref, 'save/direct-chat-')
        env:
          GH_TOKEN: ${{ secrets.SAVE_APPROVE_TAKA2_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          mapfile -t files < <(gh pr view "$PR_URL" --json files --jq '.files[].path' | sort)
          test "${#files[@]}" = "4"
          direct_chat_path="$(printf '%s\n' "${files[@]}" | grep '^直チャット/')"
          test -n "$direct_chat_path"
          expected="$(printf '%s\n' 'BUD.md' 'docs/現在状態.json' 'docs/引き継ぎ/現在の引き継ぎ.md' "$direct_chat_path" | sort)"
          actual="$(printf '%s\n' "${files[@]}" | sort)"
          test "$actual" = "$expected"

      - name: Approve as taka2-dev
        env:
          GH_TOKEN: ${{ secrets.SAVE_APPROVE_TAKA2_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve --body 'Same-repository PR auto-approved by taka2-dev.'
