name: Current state views

on:
  push:
    paths:
      - 'docs/現在状態.json'
      - 'scripts/generate_current_views.py'
      - 'scripts/check_repo_integrity.py'
      - '.github/workflows/current-state-views.yml'
      - 'BUD.md'
      - 'docs/引き継ぎ/現在の引き継ぎ.md'
      - '直チャット/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render candidate views and verify determinism
        run: python scripts/generate_current_views.py --out-dir generated/current-views --check-deterministic

      - name: Verify checked-in views match generated views
        run: |
          cmp --silent generated/current-views/BUD.md BUD.md
          cmp --silent generated/current-views/現在の引き継ぎ.md docs/引き継ぎ/現在の引き継ぎ.md
          echo "OK: checked-in views match generated views"

      - name: Run repository integrity checks
        run: python scripts/check_repo_integrity.py

      - name: Show candidate files
        run: git diff --no-index -- /dev/null generated/current-views/BUD.md || true; git diff --no-index -- /dev/null generated/current-views/現在の引き継ぎ.md || true
