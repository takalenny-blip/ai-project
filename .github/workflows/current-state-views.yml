name: Current state views

on:
  push:
    paths:
      - 'docs/現在状態.json'
      - 'scripts/generate_current_views.py'
      - 'scripts/check_repo_integrity.py'
      - 'scripts/save_and_currentize.py'
      - '.github/workflows/current-state-views.yml'
      - 'BUD.md'
      - 'docs/引き継ぎ/現在の引き継ぎ.md'
      - '直チャット/**'
      - 'scripts/search_direct_chat.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render candidate views and verify determinism
        run: python scripts/generate_current_views.py --out-dir generated/current-views --check-deterministic

      - name: Verify checked-in views match generated views
        run: |
          cmp --silent generated/current-views/BUD.md BUD.md
          cmp --silent generated/current-views/現在の引き継ぎ.md docs/引き継ぎ/現在の引き継ぎ.md
          echo "OK: checked-in views match generated views"

      - name: Run integrity self-tests
        run: python scripts/check_repo_integrity.py --self-test

      - name: Run local-clone direct-chat search smoke test
        run: |
          python scripts/search_direct_chat.py "Claude" --context 0 2>search.stderr
          grep -q '^source=local_clone ' search.stderr

      - name: Run repository integrity checks
        run: python scripts/check_repo_integrity.py

      - name: Test atomic save script twice in disposable clone
        run: |
          tmp="$RUNNER_TEMP/ai-project-save-test"
          git clone --quiet . "$tmp"
          cd "$tmp"
          git config user.name "CI atomic save test"
          git config user.email "ci-atomic-save@example.invalid"
          base=$(git rev-parse HEAD)
          save_date=$(python - <<'PY'
          import json
          import re
          from pathlib import Path
          state = json.loads(Path('docs/現在状態.json').read_text(encoding='utf-8'))
          path = state['direct_chat']['latest_path']
          print(re.match(r'^(\\d{4}-\\d{2}-\\d{2})_', path).group(1))
          PY
          )
          printf '%s\n' '# atomic save test 1' > /tmp/save-test-1.md
          printf '%s\n' '# atomic save test 2' > /tmp/save-test-2.md
          python scripts/save_and_currentize.py --content-file /tmp/save-test-1.md --date "$save_date" --message 'CI atomic save test 1'
          first=$(git rev-parse HEAD)
          test "$first" != "$base"
          python scripts/save_and_currentize.py --content-file /tmp/save-test-2.md --date "$save_date" --message 'CI atomic save test 2'
          second=$(git rev-parse HEAD)
          test "$second" != "$first"
          test "$(git rev-list --count "$base"..HEAD)" = "2"
          python scripts/check_repo_integrity.py
          python scripts/generate_current_views.py --out-dir generated/save-test --check-deterministic
          cmp --silent generated/save-test/BUD.md BUD.md
          cmp --silent generated/save-test/現在の引き継ぎ.md docs/引き継ぎ/現在の引き継ぎ.md
          test "$(git show --format='' --name-only "$first" | grep -c '^直チャット/')" = "1"
          test "$(git show --format='' --name-only "$second" | grep -c '^直チャット/')" = "1"
          test -z "$(git status --porcelain)"
          echo "OK: two atomic save operations produced exactly two commits"

      - name: Show candidate files
        run: git diff --no-index -- /dev/null generated/current-views/BUD.md || true; git diff --no-index -- /dev/null generated/current-views/現在の引き継ぎ.md || true
