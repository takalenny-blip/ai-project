name: One-time Dropbox direct-chat import

on:
  push:
    branches:
      - import/dropbox-20261017-2
    paths:
      - ".github/import-requests/20261017-2.txt"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-time-dropbox-import-20261017-2
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify the exact Dropbox source
        shell: bash
        run: |
          set -euo pipefail
          source_url='https://www.dropbox.com/scl/fi/4nlhuhv016if6jmoyboc4/20261017-2_20261017_1612.md?rlkey=x25irfs84rxbhg5padcsjj4d0&st=tj3o9ujs&dl=1'
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$source_url" --output "$RUNNER_TEMP/direct-chat.md"
          actual_bytes="$(wc -c < "$RUNNER_TEMP/direct-chat.md" | tr -d ' ')"
          test "$actual_bytes" = "7848343" || { echo "Source byte count mismatch: $actual_bytes" >&2; exit 1; }
          head -c 100 "$RUNNER_TEMP/direct-chat.md" | grep -q .
          echo "Verified source size: $actual_bytes bytes"

      - name: Configure git and create isolated save branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="save/direct-chat-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run canonical save pipeline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/save_and_currentize.py --content-file "$RUNNER_TEMP/direct-chat.md" --message 'Dropbox直チャット保存＋現在状態と生成ビューを一括同期'

      - name: Verify canonical four-file commit
        env:
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t changed < <(git -c core.quotepath=false show --format='' --name-only HEAD | sed '/^$/d')
          test "${#changed[@]}" = "4"
          direct_chat_path="$(printf '%s\n' "${changed[@]}" | grep '^直チャット/')"
          test -n "$direct_chat_path"
          expected="$(printf '%s\n' 'BUD.md' 'docs/現在状態.json' 'docs/引き継ぎ/現在の引き継ぎ.md' "$direct_chat_path")"
          actual="$(printf '%s\n' "${changed[@]}" | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

      - name: Push canonical save branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git push --set-upstream origin "$BRANCH"

      - name: Open canonical save PR
        env:
          GH_TOKEN: ${{ secrets.SAVE_PR_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "SAVE_PR_TOKEN repository secret is required." >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/pulls" -f base=main -f head="$BRANCH" -f title='直チャット保存：20261017-2_20261017_1612.md' -f body='Dropbox原本をGitHub Actions runnerで取得し、期待バイト数7,848,343を検証後、既存の正規保存スクリプトで保存。Dropbox原本は変更していない。'
