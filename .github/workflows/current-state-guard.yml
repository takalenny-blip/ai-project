name: current-state-guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce canonical state/view pairing
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/changed-paths.txt
          python3 scripts/check_canonical_state_change.py --paths-file /tmp/changed-paths.txt

      - name: Protect historical direct-chat originals
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/check_direct_chat_immutability.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
          else
            python3 scripts/check_direct_chat_immutability.py --base "$PUSH_BEFORE_SHA" --head "$PUSH_HEAD_SHA"
          fi

      - name: Run current-state guards
        run: python3 scripts/current_state_guard.py
      - name: Verify checked-in generated views match canonical state
        run: python3 scripts/generate_current_views.py --out-dir generated/current-views --check-deterministic --check-committed
      - name: Run full regression tests
        run: python3 -m unittest discover -s tests
