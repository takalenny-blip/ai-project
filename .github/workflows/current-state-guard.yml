name: current-state-guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run current-state guards
        run: python3 scripts/current_state_guard.py
      - name: Run regression tests
        run: python3 tests/test_current_state_guard.py
