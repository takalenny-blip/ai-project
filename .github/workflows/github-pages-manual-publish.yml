name: Publish GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH to publish the current main"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout confirmed main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify checkout is main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Build site
        run: python3 scripts/build_cloudflare_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
