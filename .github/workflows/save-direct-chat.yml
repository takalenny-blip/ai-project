name: Save direct chat

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Exact direct-chat markdown to save (User trigger + immediately following Bud response)'
        required: true
        type: string
      message:
        description: 'Commit message for the atomic save'
        required: false
        default: '直チャット保存＋現在状態と生成ビューを一括同期'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  save-direct-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create isolated save branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="save/direct-chat-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write exact save content
        env:
          DIRECT_CHAT_CONTENT: ${{ inputs.content }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DIRECT_CHAT_CONTENT" > "$RUNNER_TEMP/direct-chat.md"

      - name: Run canonical save script
        env:
          SAVE_MESSAGE: ${{ inputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          save_date="$(TZ=Asia/Tokyo date +%F)"
          python scripts/save_and_currentize.py \
            --content-file "$RUNNER_TEMP/direct-chat.md" \
            --date "$save_date" \
            --message "$SAVE_MESSAGE"

      - name: Verify atomic save result
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-list --count HEAD^..HEAD)" = "1"
          mapfile -t changed < <(git -c core.quotepath=false show --format='' --name-only HEAD | sed '/^$/d')
          test "${#changed[@]}" = "4"
          printf '%s\n' "${changed[@]}" | sort | diff -u - <(printf '%s\n' \
            'BUD.md' \
            'docs/現在状態.json' \
            'docs/引き継ぎ/現在の引き継ぎ.md' \
            '直チャット/'"$(git -c core.quotepath=false show --format='' --name-only HEAD | grep '^直チャット/' | sed 's#^直チャット/##')" | sort)

      - name: Push save branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git push --set-upstream origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "${{ inputs.message }}" \
            --body $'Canonical direct-chat save executed by scripts/save_and_currentize.py on an Actions runner.\n\nThe workflow creates the save commit on an isolated branch and opens this PR so the normal CI/integrity checks can run before merge.'
